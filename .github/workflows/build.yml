name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  packages: write

# Cancel in-flight runs for the same branch/PR on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════════════════
  # Go tests — one job per go.work module (matrix), each against its own
  # real Postgres service container (timescale/timescaledb-ha:pg16 -- the
  # same image docker-compose.yml uses, since the schema requires the
  # pgvector/timescaledb extensions the stock `postgres` image lacks).
  # schema/migrations-v2 is applied via the real golang-migrate CLI before
  # tests run, mirroring B-051's actual production migration mechanism.
  #
  # This is a real gate, not informational: build-images below requires
  # this job (and test-migrationtest) to pass first, so a broken test
  # blocks the image from ever reaching GHCR.
  # ════════════════════════════════════════════════════════════════════════
  test:
    name: Test — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [eami-agent, eami-collector, eami-policy, eami-api, eami-gateway]
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: eami
          POSTGRES_USER: eami_app
          POSTGRES_PASSWORD: ci_test_pg_password_not_a_real_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eami_app -d eami"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golang-migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Apply schema migrations
        run: |
          migrate -path=schema/migrations-v2 \
            -database "postgresql://eami_app:ci_test_pg_password_not_a_real_secret@127.0.0.1:5432/eami?sslmode=disable" \
            up

      - name: go build
        run: cd ${{ matrix.module }} && go build ./...

      - name: go vet
        run: cd ${{ matrix.module }} && go vet ./...

      - name: go test
        env:
          TEST_DATABASE_URL: postgresql://eami_app:ci_test_pg_password_not_a_real_secret@127.0.0.1:5432/eami
        # -count=1 disables Go's test-result cache: without it, a build/
        # source-unchanged rerun can silently reuse a stale cached result
        # instead of actually re-executing (bit this session for real --
        # see B-016/finops.go's commit message).
        run: cd ${{ matrix.module }} && go test ./... -count=1 -v

  # ════════════════════════════════════════════════════════════════════════
  # schema/migrationtest -- deliberately standalone, outside go.work (see
  # go.work's own comment). Its tests create/drop their own throwaway
  # per-test databases, so no migration pre-apply step is needed here --
  # just a reachable, CREATEDB-capable Postgres (eami_app is the image's
  # bootstrap superuser, confirmed by B-051).
  # ════════════════════════════════════════════════════════════════════════
  test-migrationtest:
    name: Test — schema/migrationtest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: eami
          POSTGRES_USER: eami_app
          POSTGRES_PASSWORD: ci_test_pg_password_not_a_real_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eami_app -d eami"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: schema/migrationtest/go.sum

      - name: go test (GOWORK=off)
        env:
          # migrationtest's own testPgConn() hardcodes host 127.0.0.1:5432
          # and reads the password from POSTGRES_PASSWORD specifically (only
          # checks TEST_DATABASE_URL is *set* to avoid skipping) -- both
          # must be provided, matching this service's actual port/password.
          TEST_DATABASE_URL: postgresql://eami_app:ci_test_pg_password_not_a_real_secret@127.0.0.1:5432/eami
          POSTGRES_PASSWORD: ci_test_pg_password_not_a_real_secret
          GOWORK: "off"
        run: cd schema/migrationtest && go test ./... -count=1 -v

  # ════════════════════════════════════════════════════════════════════════
  # Docker images — one job per service (matrix)
  # Builds on every push to main and on every tag.
  # Images are pushed to GHCR only on main/tags (not on PRs).
  # Gated on `test`/`test-migrationtest` passing first (B-052) -- a broken
  # test must never let a broken image reach the registry.
  # ════════════════════════════════════════════════════════════════════════
  build-images:
    name: Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, test-migrationtest]
    strategy:
      fail-fast: false
      matrix:
        # Each service declares its own build context and Dockerfile path.
        # eami-gateway uses context: . (repo root) because go.work and the
        # local eami-policy dependency must be accessible during the Docker build.
        # All other services use their own subdirectory as context.
        include:
          - service: eami-api
            context: ./eami-api
            dockerfile: eami-api/Dockerfile
          - service: eami-gateway
            context: .
            dockerfile: eami-gateway/Dockerfile
          - service: eami-collector
            context: ./eami-collector
            dockerfile: eami-collector/Dockerfile
          - service: eami-ui
            context: .
            dockerfile: eami-ui/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA_TAG="ghcr.io/bhargavrash-lgtm/${{ matrix.service }}:${{ github.sha }}"
          LATEST_TAG="ghcr.io/bhargavrash-lgtm/${{ matrix.service }}:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION_TAG="ghcr.io/bhargavrash-lgtm/${{ matrix.service }}:${VERSION}"
            echo "tags=${SHA_TAG},${VERSION_TAG},${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════
  # Agent binary builds — one job per platform/arch
  # All run on ubuntu-latest (cross-compilation; darwin/arm64 needs Go too)
  # Each uploads a short-lived artifact consumed by the packaging jobs below.
  # ════════════════════════════════════════════════════════════════════════

  # ── Windows amd64 ──────────────────────────────────────────────────────
  build-agent-binary:
    name: Go — eami-agent (windows/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: eami-agent/go.sum

      - name: Cross-compile Windows agent
        run: |
          cd eami-agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build \
              -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
              -o eami-agent-windows-amd64.exe \
              ./cmd/agent/

      - name: Run go vet
        run: cd eami-agent && go vet ./...

      - uses: actions/upload-artifact@v4
        with:
          name: eami-agent-windows-binary
          path: eami-agent/eami-agent-windows-amd64.exe
          retention-days: 1

  # ── Linux amd64 ────────────────────────────────────────────────────────
  build-agent-linux:
    name: Go — eami-agent (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: eami-agent/go.sum

      - name: Build Linux agent
        run: |
          cd eami-agent
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build \
              -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
              -o eami-agent-linux-amd64 \
              ./cmd/agent/

      - uses: actions/upload-artifact@v4
        with:
          name: eami-agent-linux-binary
          path: eami-agent/eami-agent-linux-amd64
          retention-days: 1

  # ── macOS amd64 + arm64 (matrix) ───────────────────────────────────────
  build-agent-macos:
    name: Go — eami-agent (darwin/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: eami-agent/go.sum

      - name: Cross-compile macOS agent (${{ matrix.arch }})
        run: |
          cd eami-agent
          GOOS=darwin GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build \
              -ldflags="-w -s -X main.Version=${{ github.ref_name }}" \
              -o eami-agent-darwin-${{ matrix.arch }} \
              ./cmd/agent/

      - uses: actions/upload-artifact@v4
        with:
          name: eami-agent-macos-${{ matrix.arch }}-binary
          path: eami-agent/eami-agent-darwin-${{ matrix.arch }}
          retention-days: 1

  # ════════════════════════════════════════════════════════════════════════
  # Windows MSI — built on windows-latest using WiX Toolset v4
  # ════════════════════════════════════════════════════════════════════════
  build-msi:
    name: MSI — eami-agent installer
    runs-on: windows-latest
    needs: build-agent-binary

    steps:
      - uses: actions/checkout@v4

      - name: Download agent binary
        uses: actions/download-artifact@v4
        with:
          name: eami-agent-windows-binary
          path: eami-agent/

      - name: Install WiX Toolset v4
        run: dotnet tool install --global wix --version "4.0.6"
        shell: pwsh

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            FILE_VERSION="${{ github.ref_name }}"
            FILE_VERSION="${FILE_VERSION#v}"
            # MSI version must be purely numeric (major.minor.build) — strip pre-release suffix
            MSI_VERSION=$(echo "$FILE_VERSION" | sed 's/[-~].*//')
          else
            MSI_VERSION="0.0.0"
            FILE_VERSION="0.0.0-${{ github.sha }}"
          fi
          echo "msi_version=${MSI_VERSION}"   >> "$GITHUB_OUTPUT"
          echo "file_version=${FILE_VERSION}"  >> "$GITHUB_OUTPUT"

      - name: Build MSI
        shell: pwsh
        run: |
          .\eami-agent\installer\build.ps1 `
            -Version     "${{ steps.version.outputs.msi_version }}" `
            -BinaryPath  "eami-agent\eami-agent-windows-amd64.exe" `
            -OutputDir   "eami-agent\installer\dist" `
            -SkipWixInstall

      - uses: actions/upload-artifact@v4
        with:
          name: eami-agent-msi
          path: eami-agent/installer/dist/*.msi
          retention-days: 30

      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: eami-agent/installer/dist/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════
  # macOS .pkg — macos-latest, pkgbuild (Xcode CLT)
  # One pkg per arch: amd64 (Intel) and arm64 (Apple Silicon).
  # ════════════════════════════════════════════════════════════════════════
  build-pkg:
    name: pkg — eami-agent (darwin/${{ matrix.arch }})
    runs-on: macos-latest
    needs: build-agent-macos
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS binary (${{ matrix.arch }})
        uses: actions/download-artifact@v4
        with:
          name: eami-agent-macos-${{ matrix.arch }}-binary
          path: eami-agent/

      - name: Make binary executable
        run: chmod +x eami-agent/eami-agent-darwin-${{ matrix.arch }}

      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-${{ github.sha }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build .pkg
        run: |
          bash eami-agent/installer/macos/build.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.arch }}" \
            "eami-agent/eami-agent-darwin-${{ matrix.arch }}" \
            "eami-agent/installer/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: eami-agent-pkg-${{ matrix.arch }}
          path: eami-agent/installer/dist/*.pkg
          retention-days: 30

      - name: Attach pkg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: eami-agent/installer/dist/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════
  # Linux .deb + .rpm — ubuntu-latest, nfpm
  # ════════════════════════════════════════════════════════════════════════
  build-linux-packages:
    name: deb + rpm — eami-agent (linux/amd64)
    runs-on: ubuntu-latest
    needs: build-agent-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: eami-agent-linux-binary
          path: eami-agent/installer/linux/

      - name: Make binary executable
        run: chmod +x eami-agent/installer/linux/eami-agent-linux-amd64

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0~${{ github.sha }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        working-directory: eami-agent/installer/linux
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}" \
            nfpm package --config nfpm.yaml --packager deb --target dist/

      - name: Build .rpm
        working-directory: eami-agent/installer/linux
        run: |
          VERSION="${{ steps.version.outputs.version }}" \
            nfpm package --config nfpm.yaml --packager rpm --target dist/

      - uses: actions/upload-artifact@v4
        with:
          name: eami-agent-linux-packages
          path: |
            eami-agent/installer/linux/dist/*.deb
            eami-agent/installer/linux/dist/*.rpm
          retention-days: 30

      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eami-agent/installer/linux/dist/*.deb
            eami-agent/installer/linux/dist/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
