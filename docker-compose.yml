# EAMI — Local Development Stack
# Usage:
#   1. cp .env.example .env  (edit passwords/keys as needed)
#   2. docker-compose up
#
# Schema is applied by the `migrate` service (golang-migrate, B-051) before
# any other service starts -- not by postgres's own init-script mechanism
# (which only ever ran schema.sql once, on a genuinely fresh data
# directory, and had no path to apply a later change to an already-seeded
# database). Fresh installs and existing installs go through the identical
# `migrate up` invocation. All services will be healthy within ~60 seconds.
#
# Ports exposed:
#   5432  — PostgreSQL
#   8081  — eami-api       (stub until BE-Policy/BE-Gateway implement it)
#   8080  — eami-gateway   (stub until BE-Gateway implements it)
#   3000  — eami-gateway MCP/SSE port (published but unused -- confirmed via
#           grep no code ever listens on it; the real gateway mux, incl.
#           MCP SSE, is served entirely on 8080. Left published here only
#           for parity with the pre-B-071 dev topology; harmless.)
#   8888  — eami-collector
#   5173  — eami-ui        (Vite dev server, hot reload)
#
# TLS (B-071) is a production-topology concern only, not added to this
# file: eami-ui's dev target runs the Vite dev server (port 5173, no
# nginx), a fundamentally different shape than the nginx production
# target docker-compose.prod.yml's eami-proxy actually fronts -- forcing
# the same Caddy topology onto a Vite HMR dev server would add real
# fragility (proxying its websocket-based hot-reload channel) for a file
# that isn't what ships to a customer anyway. Same category of documented
# prod/dev divergence as this file's Postgres port already being exposed
# here and not in prod. See docker-compose.prod.yml for the real TLS
# termination (eami-proxy) and BUILT.md's B-071 entry for the full design.

version: '3.9'

services:
  # ──────────────────────────────────────────────────────────────
  # PostgreSQL with pgvector + TimescaleDB
  # timescale/timescaledb-ha includes both extensions out of the box
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: eami
      POSTGRES_USER: eami_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}
    # Enable pg_cron (shipped in the timescaledb-ha image).
    # pg_cron auto-creates the next month's audit_log partition on the 20th of
    # each month (see schema/migrations/007_audit_partitions.sql).
    command:
      - postgres
      - -c
      - "shared_preload_libraries=timescaledb,pg_cron"
      - -c
      - "cron.database_name=eami"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      # Read-only: lets `docker compose exec postgres pg_restore ... /backups/<file>`
      # run directly against a backup without copying files between containers
      # first. eami-backup below is the only writer of this volume.
      - postgres_backups:/backups:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eami_app", "-d", "eami"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────────────────────
  # migrate — applies schema/migrations-v2/*.sql via golang-migrate (B-051)
  # Runs once to completion, then exits 0. eami-api/eami-gateway depend on
  # that success before they're allowed to start, so no service ever runs
  # against a not-yet-migrated schema. Same invocation for a fresh empty
  # database (all migrations apply) and an existing one (only pending
  # migrations apply, tracked in migrate's own schema_migrations table) --
  # deliberately one mechanism, not a fresh-install/upgrade fork.
  # ──────────────────────────────────────────────────────────────
  # SECURITY NOTE (found during this brief's own review): POSTGRES_PASSWORD
  # is interpolated into this URL unescaped -- a password containing
  # postgres:// URL-reserved characters (+, /, =, %) could misparse or, on
  # some golang-migrate versions, echo into error output. Root cause fixed
  # at the source: .env.example now documents hex-only generation
  # (openssl rand -hex 32, matching every other secret in this file and
  # setup.sh's own already-filtered generator). scripts/migrate.sh
  # (the manual invocation path) additionally URL-encodes defensively.
  # This automatic-at-boot path does not, since migrate/migrate's minimal
  # Alpine image has no reliable way to do so from pure compose YAML
  # without a fragile inline shell one-liner -- accepted as a documented
  # residual, same risk class already present (unfixed, out of this
  # brief's scope) in eami-api/eami-gateway's own DSN construction.
  migrate:
    image: migrate/migrate:v4.19.1@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
    volumes:
      - ./schema/migrations-v2:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://eami_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@postgres:5432/eami?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ──────────────────────────────────────────────────────────────
  # eami-backup — scheduled Postgres backups (B-029)
  # Runs pg_dump on a cron schedule (default daily 03:00 UTC) via Alpine's
  # busybox crond, writing timestamped custom-format dumps to the
  # postgres_backups volume. See RECOVERY.md for the restore procedure.
  # ──────────────────────────────────────────────────────────────
  eami-backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://eami_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@postgres:5432/eami
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
    entrypoint: ["sh", "/scripts/backup-entrypoint.sh"]
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup-db.sh:/scripts/backup-db.sh:ro
      - ./scripts/backup-entrypoint.sh:/scripts/backup-entrypoint.sh:ro
      - ./scripts/restore-db.sh:/scripts/restore-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # eami-collector — on-prem data collector
  # Build context: ./eami-collector (owned by BE-Collector)
  # Stub Dockerfile in place until real service code lands.
  # ──────────────────────────────────────────────────────────────
  eami-collector:
    build:
      context: ./eami-collector
      dockerfile: Dockerfile
    environment:
      COLLECTOR_LISTEN_PORT: "8888"
      COLLECTOR_SAAS_URL: http://eami-api:8081
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY}
      COLLECTOR_SERVICE_KEY: ${API_SERVICE_KEY}
      COLLECTOR_BUFFER_DB_PATH: /app/data/buffer.db
    volumes:
      - collector_data:/app/data
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # eami-gateway — MCP control plane
  # Build context: repo root (go.work + eami-policy required)
  # ──────────────────────────────────────────────────────────────
  eami-gateway:
    build:
      context: .
      dockerfile: eami-gateway/Dockerfile
    environment:
      GATEWAY_LISTEN_API_PORT: "8080"
      GATEWAY_LISTEN_MCP_SSE_PORT: "3000"
      GATEWAY_DB_HOST: postgres
      GATEWAY_DB_NAME: eami
      GATEWAY_DB_USER: eami_app
      GATEWAY_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}
      GATEWAY_JWT_KEY_PATH: /certs/gateway.key
      GATEWAY_APPROVAL_SLACK_WEBHOOK: ${GATEWAY_APPROVAL_SLACK_WEBHOOK:-}
      GATEWAY_UI_BASE_URL: ${GATEWAY_UI_BASE_URL:-http://localhost:5173}
      GATEWAY_API_SERVICE_KEY: ${GATEWAY_API_SERVICE_KEY}
      GATEWAY_EPISODE_READ_SERVICE_KEY: ${GATEWAY_EPISODE_READ_SERVICE_KEY}
      # Gates POST /v1/gateway/tokens/{jti}/revoke (B-042). Gateway-local
      # only today -- no caller exists yet, see BACKLOG.md B-042.
      GATEWAY_TOKEN_REVOKE_SERVICE_KEY: ${GATEWAY_TOKEN_REVOKE_SERVICE_KEY}
      # Decrypts gateway_tools credentials for dynamic rest_api tool
      # dispatch (B-044). Same value as eami-api's own
      # TOOL_CREDENTIALS_ENCRYPTION_KEY below -- one shared secret, two
      # consumers (eami-api encrypts on write, eami-gateway decrypts on
      # dispatch), not a gateway-specific key.
      TOOL_CREDENTIALS_ENCRYPTION_KEY: ${TOOL_CREDENTIALS_ENCRYPTION_KEY}
      GATEWAY_PPROF_ADDR: ${GATEWAY_PPROF_ADDR:-}
    volumes:
      - gateway_certs:/certs
    ports:
      - "8080:8080"
      - "3000:3000"
      - "7946:7946"
      - "6060:6060"  # pprof — only active when GATEWAY_PPROF_ADDR=:6060
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # eami-api — SaaS REST API backend
  # Build context: ./eami-api (owned by BE-Policy + Architect-EAMI)
  # Stub in place until eami-api service code lands.
  # ──────────────────────────────────────────────────────────────
  eami-api:
    build:
      context: ./eami-api
      dockerfile: Dockerfile
    environment:
      API_LISTEN_PORT: "8081"
      API_DB_HOST: postgres
      API_DB_NAME: eami
      API_DB_USER: eami_app
      API_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}
      API_SERVICE_KEY: ${API_SERVICE_KEY}
      # RSA key for signing user-session JWTs (RS256). Persisted on the
      # api_certs volume (B-026) so access tokens survive a restart instead
      # of every restart force-logging-out every user.
      API_JWT_KEY_PATH: /certs/api.key
      # Collector integration — enables the failed_delivery_count alert metric.
      COLLECTOR_URL: http://eami-collector:8888
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY}
      COLLECTOR_SERVICE_KEY: ${API_SERVICE_KEY}
      # Gateway episode proxy (B-002 Brief 2) — reuses the same
      # GATEWAY_EPISODE_READ_SERVICE_KEY value eami-gateway validates inbound.
      API_GATEWAY_URL: http://eami-gateway:8080
      GATEWAY_EPISODE_READ_SERVICE_KEY: ${GATEWAY_EPISODE_READ_SERVICE_KEY}
      # Encrypts gateway_tools credentials before they're stored. Unset =
      # CreateTool fails closed (clear error) for any request that submits
      # credentials; tool creation without credentials is unaffected.
      TOOL_CREDENTIALS_ENCRYPTION_KEY: ${TOOL_CREDENTIALS_ENCRYPTION_KEY}
    volumes:
      - api_certs:/certs
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # eami-ui — React web application
  # Build context: ./eami-ui (owned by FE-Dashboard)
  # Development target uses Vite dev server with hot reload.
  # ──────────────────────────────────────────────────────────────
  eami-ui:
    build:
      context: .
      dockerfile: eami-ui/Dockerfile
      target: development
    environment:
      # Vite proxy runs inside Docker — must use service names, not host IPs
      VITE_API_URL: http://eami-api:8081
      VITE_GATEWAY_URL: http://eami-gateway:8080
    volumes:
      - ./eami-ui/src:/app/src   # hot reload in dev
    ports:
      - "5173:5173"
    depends_on:
      - eami-api
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_backups:
  collector_data:
  gateway_certs:
  api_certs:
